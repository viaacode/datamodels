id: https://data.hetarchief.be/ns/description
name: description
title: Data model Description
description: Data model to describe the content of objects.
version: 1.1.0
license: https://creativecommons.org/publicdomain/zero/1.0/
default_prefix: haDes
default_range: string
imports:
  - linkml:types
prefixes:
  linkml: "https://w3id.org/linkml/"
  haDes: "https://data.hetarchief.be/ns/description/"
  haObj: "https://data.hetarchief.be/ns/object/"
  haOrg: "https://data.hetarchief.be/ns/organization/"
  bf: "http://id.loc.gov/ontologies/bibframe/"
  dct: "http://purl.org/dc/terms/"
  dbo: "http://dbpedia.org/ontology/"
  ebucore: "http://www.ebu.ch/metadata/ontologies/ebucore/ebucore#"
  edtf: "http://id.loc.gov/datatypes/edtf/"
  foaf: "http://xmlns.com/foaf/0.1/"
  org: "http://www.w3.org/ns/org#"
  owl: "http://www.w3.org/2002/07/owl#"
  premis: "http://www.loc.gov/premis/rdf/v3/"
  rdf: "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
  rdfs: "http://www.w3.org/2000/01/rdf-schema#"
  rel: "http://id.loc.gov/vocabulary/preservation/relationshipSubType/"
  schema: "https://schema.org/"
  sh: "http://www.w3.org/ns/shacl#"
  skos: "http://www.w3.org/2004/02/skos/core#"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  haCt: "https://data.hetarchief.be/id/color-type/"
  haEdTId: "https://data.hetarchief.be/id/edition-type/"
  haPrmId: "https://data.hetarchief.be/id/production-method/"
  haRot: "https://data.hetarchief.be/id/rotational-speed/"

types:
  Any:
    typeof: string
    description: Unconstrained value from SHACL union or node-kind constraints.
  EDTF_level0:
    typeof: string
    uri: edtf:EDTF-level0
  EDTF_level1:
    typeof: string
    uri: edtf:EDTF-level1
  EDTF_level2:
    typeof: string
    uri: edtf:EDTF-level2

classes:
  NewspaperIssue:
    class_uri: haDes:NewspaperIssue
    title: "Newspaper issue"
    description: "This class applies to media in meemoo's archive that is originally derived from an analog carrier of type newspaper, and represents the newspaper edition as a whole."
    is_a: IntellectualEntity
    slots:
      - numberOfPages
      - isPartOf
      - issueNumber
      - issuance
      - edition
      - hasCarrierCopy
    slot_usage:
      numberOfPages:
        multivalued: false
        range: integer
      isPartOf:
        multivalued: false
        range: Newspaper
      issueNumber:
        multivalued: false
        range: string
      issuance:
        multivalued: false
        range: Concept
      edition:
        multivalued: false
        range: edition_enum
      hasCarrierCopy:
        multivalued: false
        range: WrittenWorkCarrierRepresentation
  NewspaperIssuePage:
    class_uri: haDes:NewspaperIssuePage
    title: "Newspaper issue page"
    description: "This class applies to media in meemoo's archive that is originally derived from an analog carrier of type newspaper, and represents a specific newspaper page."
    is_a: IntellectualEntity
    slots:
      - pageNumber
      - isp
    slot_usage:
      pageNumber:
        multivalued: false
        range: integer
      isp:
        required: true
        multivalued: false
        range: NewspaperIssue
  DVD:
    class_uri: haDes:DVD
    title: "DVD"
    description: "This class applies to media in meemoo's archive that is originally derived from an analog carrier of type DVD, and represents the DVD as a whole."
    is_a: IntellectualEntity
    slots:
      - broadcastingOrganization
      - hasCarrierCopy
      - hsp
    slot_usage:
      broadcastingOrganization:
        multivalued: false
        range: Organization
      hasCarrierCopy:
        multivalued: false
        range: AudiovisualCarrierRepresentation
      hsp:
        multivalued: true
        range: DVDChapter
  DVDChapter:
    class_uri: haDes:DVDChapter
    title: "DVD chapter"
    description: "This class applies to media in meemoo's archive that is originally derived from an analog carrier of type DVD, and represents a specific DVD chapter."
    is_a: IntellectualEntity
    slots:
      - isi
      - chapterNumber
    slot_usage:
      isi:
        required: true
        multivalued: false
        range: DVD
      chapterNumber:
        required: true
        multivalued: false
        range: integer
  Film:
    class_uri: haDes:Film
    title: "Film"
    description: "This class applies to media in meemoo's archive that is originally derived from an analog carrier of type film."
    is_a: IntellectualEntity
    slots:
      - broadcastingOrganization
      - hasCarrierCopy
    slot_usage:
      broadcastingOrganization:
        multivalued: false
        range: Organization
      hasCarrierCopy:
        required: true
        multivalued: false
        range: FilmCarrierRepresentation
  SilentFilm:
    class_uri: haDes:SilentFilm
    title: "Silent film"
    description: "This class applies to media in meemoo's archive that is originally derived from an analog carrier for silent film."
    is_a: Film
  SoundFilm:
    class_uri: haDes:SoundFilm
    title: "Sound film"
    description: "This class applies to media in meemoo's archive that is originally derived from an analog carrier for sound film."
    is_a: Film
  ImageReel:
    class_uri: haDes:ImageReel
    title: "Image reel"
    description: "A reel of an analog film carrier that contains video."
    is_a: PhysicalCarrier
    slots:
      - coloringType
      - hasCaptioning
      - aspectRatio
    slot_usage:
      coloringType:
        multivalued: true
        range: coloringType_enum
      hasCaptioning:
        multivalued: true
        range: OpenCaptions
      aspectRatio:
        multivalued: false
        range: string
  AudioReel:
    class_uri: haDes:AudioReel
    title: "Audio reel"
    description: "A reel of an analog film carrier that contains audio."
    is_a: PhysicalCarrier
    slots:
      - aspectRatio
    slot_usage:
      aspectRatio:
        multivalued: false
        range: string
  Audio:
    class_uri: haDes:Audio
    title: "Audio"
    description: "This class applies to media in meemoo's archive that is originally derived from digital born audio or an analog carrier of type audio."
    is_a: IntellectualEntity
    slots:
      - broadcastingOrganization
      - hasCarrierCopy
    slot_usage:
      broadcastingOrganization:
        multivalued: false
        range: Organization
      hasCarrierCopy:
        multivalued: false
        range: AudiovisualCarrierRepresentation
  Video:
    class_uri: haDes:Video
    title: "Video"
    description: "This class applies to media in meemoo's archive that is originally derived from digital born video or an analog carrier of type video."
    is_a: IntellectualEntity
    slots:
      - broadcastingOrganization
      - hasCarrierCopy
    slot_usage:
      broadcastingOrganization:
        multivalued: false
        range: Organization
      hasCarrierCopy:
        multivalued: false
        range: AudiovisualCarrierRepresentation
  Image:
    class_uri: haDes:Image
    title: "Image"
    description: "This class applies to media in meemoo's archive that is originally derived from a digital born image or an analog carrier of type image."
    is_a: IntellectualEntity
  MaterialArtwork:
    class_uri: haDes:MaterialArtwork
    title: "Material artwork"
    description: "This class applies to media in meemoo's archive that is originally derived from any form of visual art that entirely exists in physical reality, in space and time."
    is_a: IntellectualEntity
  2DArtwork:
    class_uri: haDes:2DArtwork
    title: "Two-dimensional artwork"
    description: "This class applies to media in meemoo's archive that is originally derived from any form of visual art that exists in two dimensions. Two-dimensional artforms can include drawings, paintings, prints, and photographs. It does not include three-dimensional artworks such as sculptures, installations, and three-dimensional paintings."
    is_a: MaterialArtwork
  3DArtwork:
    class_uri: haDes:3DArtwork
    title: "Three-dimensional artwork"
    description: "This class applies to media in meemoo's archive that is originally derived from any form of visual art that exists in three dimensions. Two-dimensional artforms can include sculptures, installations, and three-dimensional paintings. It does not include two-dimensional artworks such as drawings, paintings, prints, and photographs."
    is_a: MaterialArtwork
  RoleName:
    class_uri: haDes:RoleName
    title: "Role name"
    description: "The role played, performed or filled by a thing, person or organization."
    is_a: Concept
  AudiovisualCarrier:
    class_uri: haDes:AudiovisualCarrier
    title: "Audiovisual carrier"
    description: "A physical carrier that stores audio or audiovisual content."
    is_a: PhysicalCarrier
    slots:
      - iec60094Type
      - audioRecordingSpeed
      - audioNoiseReduction
    slot_usage:
      iec60094Type:
        multivalued: false
        range: iec60094Type_enum
      audioRecordingSpeed:
        multivalued: false
        range: audioRecordingSpeed_enum
      audioNoiseReduction:
        multivalued: false
        range: audioNoiseReduction_enum
  AudiovisualCarrierRepresentation:
    class_uri: haDes:AudiovisualCarrierRepresentation
    title: "Audiovisual carrier representation"
    description: "A physical or digital representation of an archived audio or video entity that is stored on an audiovisual physical carrier such as a video tape."
    is_a: CarrierRepresentation
    slots:
      - numberOfAudioTracks
      - numberOfAudioChannels
      - storedAt
    slot_usage:
      numberOfAudioTracks:
        multivalued: false
        range: integer
      numberOfAudioChannels:
        multivalued: false
        range: integer
      storedAt:
        required: true
        multivalued: true
        range: AudiovisualCarrier
  WrittenWorkCarrierRepresentation:
    class_uri: haDes:WrittenWorkCarrierRepresentation
    title: "Written work carrier representation"
    description: "A physical or digital representation of an archived written work that is stored on a physical carrier such as a printed newspaper or book."
    is_a: CarrierRepresentation
    slots:
      - productionMethod
    slot_usage:
      productionMethod:
        multivalued: false
        range: productionMethod_enum
  FilmCarrierRepresentation:
    class_uri: haDes:FilmCarrierRepresentation
    title: "Film carrier representation"
    description: "A representation of an archived film that is stored on a analog film carrier such as a film stock."
    is_a: CarrierRepresentation
    slots:
      - numberOfMissingAudioReels
      - numberOfMissingImageReels
      - hasMissingAudioReels
      - hasMissingImageReels
      - numberOfReels
      - storedAt
    slot_usage:
      numberOfMissingAudioReels:
        multivalued: false
        range: integer
      numberOfMissingImageReels:
        multivalued: false
        range: integer
      hasMissingAudioReels:
        multivalued: false
        range: boolean
      hasMissingImageReels:
        multivalued: false
        range: boolean
      numberOfReels:
        multivalued: false
        range: integer
      storedAt:
        required: true
        multivalued: true
        range: Any
        any_of:
          - range: ImageReel
          - range: AudioReel
  IntellectualEntity:
    class_uri: premis:IntellectualEntity
    slots:
      - identifier
      - name
      - description
      - duration
      - maintainer
      - alternateName
      - isPartOf
      - dateCreated
      - datePublished
      - creator
      - publisher
      - producer
      - executor
      - contributor
      - actor
      - abstract
      - genre
      - spatial
      - temporal
      - keywords
      - inLanguage
      - license
      - available
      - copyrightHolder
      - licenseDistributor
      - owner
      - copyrightNotice
      - copyrightYear
      - rights
      - creditText
      - about
      - mentions
      - artform
      - artMedium
      - format
      - height
      - depth
      - width
      - hasObjectType
      - hasCastMember
      - synopsis
    slot_usage:
      identifier:
        required: true
        multivalued: false
        range: string
      name:
        required: true
        multivalued: true
        range: string
      description:
        multivalued: true
        range: string
      duration:
        multivalued: false
        range: string
      maintainer:
        required: true
        multivalued: false
        range: ContentPartner
      alternateName:
        multivalued: true
        range: string
      isPartOf:
        multivalued: true
        range: Any
        any_of:
          - range: CreativeWork
          - range: BroadcastEvent
      dateCreated:
        required: true
        multivalued: false
        range: Any
        any_of:
          - range: EDTF_level0
          - range: EDTF_level1
          - range: EDTF_level2
      datePublished:
        multivalued: false
        range: Any
        any_of:
          - range: EDTF_level0
          - range: EDTF_level1
          - range: EDTF_level2
      creator:
        multivalued: true
        range: Role
      publisher:
        multivalued: true
        range: Role
      producer:
        multivalued: true
        range: Role
      executor:
        multivalued: true
        range: Role
      contributor:
        multivalued: true
        range: Role
      actor:
        multivalued: true
        range: PerformanceRole
      abstract:
        multivalued: true
        range: string
      genre:
        multivalued: true
        range: string
      spatial:
        multivalued: true
        range: Place
      temporal:
        multivalued: true
        range: string
      keywords:
        multivalued: true
        range: string
      inLanguage:
        multivalued: true
        range: string
      license:
        multivalued: true
        range: Concept
      available:
        multivalued: false
        range: datetime
      copyrightHolder:
        multivalued: true
        range: Any
        any_of:
          - range: Person
          - range: Organization
          - range: Thing
      licenseDistributor:
        multivalued: true
        range: Any
        any_of:
          - range: Person
          - range: Organization
          - range: Thing
      owner:
        multivalued: true
        range: Any
        any_of:
          - range: Person
          - range: Organization
          - range: Thing
      copyrightNotice:
        multivalued: true
        range: string
      copyrightYear:
        multivalued: true
        range: integer
      rights:
        multivalued: true
        range: string
      creditText:
        multivalued: true
        range: string
      about:
        multivalued: true
        range: uriorcurie
      mentions:
        multivalued: true
        range: Thing
      artform:
        multivalued: true
        range: string
      artMedium:
        multivalued: true
        range: string
      format:
        required: true
        multivalued: false
        range: format_enum
      height:
        multivalued: false
        range: QuantitativeValue
      depth:
        multivalued: false
        range: QuantitativeValue
      width:
        multivalued: false
        range: QuantitativeValue
      hasObjectType:
        multivalued: false
        range: string
      hasCastMember:
        multivalued: false
        range: string
      synopsis:
        multivalued: false
        range: string
  PhysicalCarrier:
    class_uri: haObj:PhysicalCarrier
    slots:
      - identifier
      - name
      - description
      - brand
      - materialExtent
      - preservationProblem
      - height
      - depth
      - width
      - material
    slot_usage:
      identifier:
        required: true
        multivalued: false
        range: string
      name:
        required: true
        multivalued: true
        range: string
      description:
        multivalued: true
        range: string
      brand:
        multivalued: false
        range: Brand
      materialExtent:
        multivalued: false
        range: string
      preservationProblem:
        multivalued: true
        range: Concept
      height:
        multivalued: false
        range: QuantitativeValue
      depth:
        multivalued: false
        range: QuantitativeValue
      width:
        multivalued: false
        range: QuantitativeValue
      material:
        multivalued: false
        range: string
  File:
    class_uri: premis:File
    slots:
      - name
      - description
      - duration
      - identifier
      - hasCaptioning
      - hasMediaFragment
      - dateCreated
      - thumbnailUrl
    slot_usage:
      name:
        required: true
        multivalued: true
        range: string
      description:
        multivalued: true
        range: string
      duration:
        multivalued: false
        range: string
      identifier:
        multivalued: false
        range: string
      hasCaptioning:
        multivalued: true
        range: Any
        any_of:
          - range: File
          - range: ClosedCaptions
      hasMediaFragment:
        multivalued: true
        range: MediaFragment
      dateCreated:
        required: true
        multivalued: false
        range: Any
        any_of:
          - range: EDTF_level0
          - range: EDTF_level1
